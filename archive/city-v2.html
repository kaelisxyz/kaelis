<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forge City · Kaelis</title>
<meta name="description" content="A neon city run by Kaelis. Each tower is one job: scan tokens, light a window for every holder, reward builders, watch tokens. Step inside to see the agent at work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --night: #0a0718; --panel: rgba(14, 10, 34, 0.86); --line: rgba(160, 150, 255, 0.28);
    --text: #f1eefc; --mute: #a59fc4;
    --mint: #59e7ca; --amber: #ffc24a; --ember: #ff8a4d; --violet: #9d8bff; --danger: #ff4d6a;
    --f-sans: "Inter Tight", "Helvetica Neue", Arial, system-ui, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --gut: max(16px, env(safe-area-inset-left, 0px));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--text); overflow: hidden; }
  body { font-family: var(--f-sans); -webkit-font-smoothing: antialiased; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  a { color: inherit; }
  .mono { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }

  header.top { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: max(12px, env(safe-area-inset-top, 0px)) var(--gut) 12px; pointer-events: none; }
  header.top > * { pointer-events: auto; }
  .brand { display: grid; gap: 2px; text-decoration: none; }
  .brand b { font-family: var(--f-mono); font-weight: 700; letter-spacing: .3em; font-size: 14px; }
  .brand span { font-family: var(--f-mono); font-size: 10px; letter-spacing: .14em; color: var(--mute); text-transform: uppercase; }
  nav.links { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .pill { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; color: var(--text);
    border: 1px solid var(--line); background: rgba(10, 7, 24, .6); padding: 8px 12px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(6px); }
  .pill:hover { border-color: var(--mint); color: var(--mint); }
  .pill:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }

  /* floating tower labels (projected from 3D each frame) */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { position: absolute; transform: translate(-50%, -100%); display: grid; gap: 3px; padding: 6px 9px 7px; min-width: 112px;
    background: rgba(8, 6, 22, .82); border: 1px solid var(--c, var(--mint)); border-radius: 4px; box-shadow: 0 0 18px -6px var(--c, var(--mint));
    font-family: var(--f-mono); text-transform: uppercase; white-space: nowrap; transition: opacity .25s; pointer-events: auto; cursor: pointer; }
  .lbl .n { font-size: 10px; letter-spacing: .14em; color: var(--c); font-weight: 700; }
  .lbl .v { font-size: 15px; font-weight: 700; letter-spacing: .02em; color: #fff; }
  .lbl .s { font-size: 9px; letter-spacing: .1em; color: var(--mute); }
  .lbl::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 1px; height: 7px; background: var(--c); }

  /* bottom tower bar: keyboard + touch way in */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    padding: 12px var(--gut) max(14px, env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, rgba(6, 4, 16, .85)); }
  .dock button { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text); cursor: pointer;
    background: rgba(12, 9, 30, .8); border: 1px solid var(--c); border-radius: 4px; padding: 9px 12px; display: flex; gap: 8px; align-items: center; }
  .dock button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .dock button:hover { background: rgba(30, 22, 70, .9); }
  .hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: 64px; z-index: 4; color: var(--mute); pointer-events: none; text-align: center; }

  /* inside a tower: info + actions */
  .panel { position: fixed; z-index: 6; top: 76px; right: var(--gut); width: min(360px, calc(100vw - 32px)); max-height: calc(100dvh - 160px); overflow: auto;
    background: var(--panel); border: 1px solid var(--c, var(--line)); border-radius: 6px; box-shadow: 0 0 40px -18px var(--c); backdrop-filter: blur(10px); }
  .panel[hidden] { display: none; }
  .panel .bar { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; background: var(--c); color: #090616; }
  .panel .bar b { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .panel .bar button { background: none; border: 0; color: inherit; font: 700 11px var(--f-mono); letter-spacing: .1em; cursor: pointer; text-transform: uppercase; }
  .panel .body { padding: 14px; display: grid; gap: 12px; }
  .panel h2 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
  .panel p { margin: 0; color: var(--mute); font-size: 14px; line-height: 1.5; }
  .panel .row { display: flex; gap: 8px; }
  .panel input { flex: 1; min-width: 0; font: 13px var(--f-mono); color: var(--text); background: rgba(0, 0, 0, .35); border: 1px solid var(--line); border-radius: 4px; padding: 10px; }
  .act { font: 700 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: #090616; background: var(--c); border: 0; border-radius: 4px; padding: 10px 14px; cursor: pointer; }
  .act:disabled { opacity: .5; cursor: wait; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-family: var(--f-mono); font-size: 12px; }
  .kv span:nth-child(odd) { color: var(--mute); }
  .tagx { display: inline-block; font: 700 9.5px var(--f-mono); letter-spacing: .14em; padding: 3px 6px; border-radius: 3px; border: 1px solid currentColor; text-transform: uppercase; }
  .out { font-family: var(--f-mono); font-size: 12px; line-height: 1.55; color: var(--text); white-space: pre-wrap; }
  .score { font: 700 40px var(--f-mono); letter-spacing: -.02em; }
  .fine { font-size: 11px !important; }

  .fade { position: fixed; inset: 0; background: #05030c; opacity: 0; pointer-events: none; z-index: 8; transition: opacity .28s ease; }
  .fade.on { opacity: 1; }
  .nogl { position: fixed; inset: 0; z-index: 9; display: grid; place-content: center; gap: 12px; text-align: center; padding: 24px; background: var(--night); }
  .nogl[hidden] { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (max-width: 700px) {
    .panel { top: auto; bottom: 0; right: 0; left: 0; width: 100%; max-height: 48dvh; border-radius: 10px 10px 0 0; }
    .hint { bottom: 112px; }
    .lbl { min-width: 0; padding: 4px 6px; } .lbl .v { font-size: 12px; } .lbl .s { display: none; }
    nav.links .opt { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .fade { transition: none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Forge City: a neon plaza with four towers around the Kaelis core"></canvas>
<div id="labels"></div>

<header class="top">
  <a class="brand" href="index.html" id="backStory"><b>KAELIS</b><span>Forge City</span></a>
  <nav class="links" aria-label="Main">
    <a class="pill opt" href="scan.html">Scanner page</a>

    <a class="pill opt" href="evolution.html">Evolution</a>

  <p style="margin:0;color:var(--mute)">Your browser can't draw the 3D city. The tools still work:</p>
  <p style="margin:0"><a class="pill" href="scan.html">Open the scanner</a> <a class="pill" href="tower.html">Holder tower</a></p>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const K = window.KaelisCore, CFG = window.KAELIS_CONFIG || {};
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const small = matchMedia("(max-width: 700px)").matches;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const fmt = (n) => Number(n).toLocaleString("en-US");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// When the city is shown inside the story page, "back" talks to the parent instead of navigating
if (window.parent !== window) $("backStory").addEventListener("click", (e) => { e.preventDefault(); window.parent.postMessage({ kaelis: "story" }, "*"); });

// ---------------------------------------------------------------- towers (one per Kaelis job)
const TOWERS = [
  { id: "scanner", name: "Scanner", color: "#59e7ca", angle: -0.55, h: 15, intro: "Kaelis checks a Solana token before you buy: a sell test, liquidity, top holders, locked LP, mint and freeze authority, Token-2022 controls and pool age. Live data." },
  { id: "holders", name: "Holders", color: "#ffc24a", angle: 0.85, h: 18, intro: "One lit window for every wallet that holds $KAEL, read from the chain. Sell everything and the window goes dark. Before launch you can try it with any token." },
  { id: "builders", name: "Builders", color: "#ff8a4d", angle: 2.35, h: 13, intro: "Proof-of-Build: link your GitHub and a Solana wallet. Kaelis counts your pull requests merged into other people's projects every week and keeps your points. Points convert to $KAEL at launch." },
  { id: "watch", name: "Watch", color: "#9d8bff", angle: -2.2, h: 11.5, intro: "Keep an eye on a token you scanned. Kaelis re-checks it every 60 seconds while this page is open and warns you when liquidity drops or an authority comes back." },
];
const byId = Object.fromEntries(TOWERS.map((t) => [t.id, t]));

// ---------------------------------------------------------------- shared live state
const state = {
  server: false, health: null,
  lastScan: null,          // { mint, symbol, result, data, at, source }
  scanning: false,
  holders: null,           // { count, complete } when $KAEL is live
  holdersPreview: null,    // { mint, count, complete, top10 } for any token before launch
  builders: null,          // leaderboard from /api/builders
  join: { wallet: null },
  watch: { log: [], timer: null, prev: null, checks: 0 },
};

async function checkHealth() {
  try {
    const r = await fetch("api/health", { cache: "no-store" });
    if (r.ok) { state.health = await r.json(); state.server = !!state.health.ok; }
  } catch (e) { state.server = false; }
}
function tokenSymbol(data, mint) {
  const p = (data && data.pairs && data.pairs[0]) || null;
  const t = p ? (p.baseToken && p.baseToken.address === mint ? p.baseToken : p.quoteToken) : null;
  return (t && t.symbol) || mint.slice(0, 4) + "…";
}
async function scanMint(mint) {
  mint = String(mint || "").trim();
  if (!K || !K.isAddress(mint)) throw new Error("That doesn't look like a Solana token address (32 to 44 characters).");
  if (state.server) {
    try {
      const r = await fetch("api/scan?mint=" + encodeURIComponent(mint));
      if (r.ok) { const j = await r.json(); if (j.result) return { mint, data: j.data, result: j.result, source: "Kaelis server", explain: j.explain }; }
    } catch (e) { /* fall back to the browser */ }
  }
  const data = await K.gather(mint, { rpcUrls: CFG.rpcUrls });
  return { mint, data, result: K.evaluate(data), source: "your browser" };
}
async function loadHolders() {
  const mint = CFG.kaelMint;
  if (!mint) return;
  try {
    const r = await fetch("api/holders?mint=" + encodeURIComponent(mint));
    if (r.ok) { const j = await r.json(); state.holders = { count: j.count != null ? j.count : (j.holders || []).length, complete: !!j.complete }; }
  } catch (e) { /* stays "at launch" */ }
}
async function loadBuilders() {
  if (!state.server) return;
  try { const r = await fetch("api/builders", { cache: "no-store" }); if (r.ok) state.builders = await r.json(); } catch (e) { /* keep last */ }
}
async function previewHolders(mint) {
  mint = String(mint || "").trim();
  if (!K.isAddress(mint)) throw new Error("That doesn't look like a Solana token address.");
  if (!state.server) throw new Error("The holder count needs the Kaelis server (npm start).");
  const r = await fetch("api/holders?mint=" + encodeURIComponent(mint)), j = await r.json();
  if (!r.ok) throw new Error(j.error || "Holder lookup failed.");
  const list = j.holders || [];
  state.holdersPreview = { mint, count: j.count, complete: !!j.complete, shown: list.length, top10: list.slice(0, 10).reduce((t, h) => t + (h.share || 0), 0) };
}
// watch baseline; tolerate partial data (a failed RPC read must not break the scan)
const safePulse = (d) => { try { return K.pulse ? K.pulse(d) : null; } catch (e) { return null; } };
const walletProvider = () => (window.phantom && window.phantom.solana) || window.solflare || window.solana || null;
const riskColor = (s) => (s >= 70 ? "#ff4d6a" : s >= 40 ? "#ffc24a" : "#59e7ca");
const bandText = (b) => (b === "dangerous" ? "Danger" : b === "suspicious" ? "Suspicious" : "Low risk");


// ---------------------------------------------------------------- renderer
const canvas = $("c");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: !small, powerPreference: "high-performance" });
} catch (e) { $("nogl").hidden = false; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, small ? 1.5 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // dark neon scene: a filmic curve keeps glows rich instead of clipping
renderer.toneMappingExposure = 0.95;
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(small ? 52 : 40, 1, 0.1, 600);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.07; controls.enablePan = false;

const city = new THREE.Scene();
const room = new THREE.Scene();
city.environment = envTex; city.environmentIntensity = 0.35;
room.environment = envTex; room.environmentIntensity = 0.5;
let scene = city;

const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(city, camera);
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.6, 0.45, 0.82);
const BLOOM = { city: [small ? 0.5 : 0.62, 0.45, 0.8], room: [0.32, 0.3, 0.93] };
const setBloom = (k) => { [bloom.strength, bloom.radius, bloom.threshold] = BLOOM[k]; };
setBloom("city");
composer.addPass(renderPass); composer.addPass(bloom); composer.addPass(new OutputPass());

// ---------------------------------------------------------------- texture helpers
const srgb = (t) => { t.colorSpace = THREE.SRGBColorSpace; return t; };
function canvasTex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); return srgb(new THREE.CanvasTexture(c)); }
function rand(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// window grid for tower facades: dark glass with a share of lit windows (white, tinted by emissive colour)
function windowsTex(seed, cols = 6, rows = 24, lit = 0.42) {
  const r = rand(seed);
  return canvasTex(128, 512, (g, w, h) => {
    g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
    const cw = w / cols, rh = h / rows;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      if (r() < lit) { const b = 150 + r() * 105; g.fillStyle = `rgb(${b},${b},${b})`; g.fillRect(x * cw + cw * 0.22, y * rh + rh * 0.22, cw * 0.56, rh * 0.5); }
    }
  });
}
function gridTex(color, cells = 8, alpha = 0.55) {
  const t = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
    g.strokeStyle = color; g.globalAlpha = alpha; g.lineWidth = 2;
    for (let i = 0; i <= cells; i++) { const p = (i / cells) * w; g.beginPath(); g.moveTo(p, 0); g.lineTo(p, h); g.stroke(); g.beginPath(); g.moveTo(0, p); g.lineTo(w, p); g.stroke(); }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}
function glowSprite(color, size) {
  const tex = canvasTex(128, 128, (g) => { const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, "#fff"); gr.addColorStop(0.25, color); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  s.scale.setScalar(size); return s;
}

const beams = [];
// =================================================================== CITY
// sky dome: deep indigo to violet horizon, plus stars
{
  const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }",
    fragmentShader: "varying vec3 vP; void main(){ float h = clamp(vP.y*1.6+0.08, 0., 1.); vec3 top = vec3(0.012,0.008,0.05); vec3 mid = vec3(0.07,0.03,0.22); vec3 hor = vec3(0.32,0.12,0.55); vec3 c = mix(hor, mid, smoothstep(0.,0.18,h)); c = mix(c, top, smoothstep(0.18,0.9,h)); gl_FragColor = vec4(c,1.); }",
  }));
  city.add(sky);
  const n = 1400, pos = new Float32Array(n * 3), r = rand(7);
  for (let i = 0; i < n; i++) { const th = r() * Math.PI * 2, ph = Math.acos(0.15 + r() * 0.85), R = 380; pos.set([R * Math.sin(ph) * Math.cos(th), R * Math.cos(ph), R * Math.sin(ph) * Math.sin(th)], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  city.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xcfc8ff, size: 1.3, sizeAttenuation: true, depthWrite: false })));
  city.fog = new THREE.FogExp2(0x120830, 0.0065);
}

// ground: dark plaza with a glowing grid, light rings and spokes
const plaza = new THREE.Group(); city.add(plaza);
{
  const floor = new THREE.Mesh(new THREE.CircleGeometry(140, 96), new THREE.MeshStandardMaterial({
    color: 0x0a0820, roughness: 0.55, metalness: 0.35, emissive: 0xffffff, emissiveIntensity: 0.32,
    emissiveMap: (() => { const t = gridTex("#6b5cff", 8, 0.5); t.repeat.set(34, 34); return t; })(),
  }));
  floor.rotation.x = -Math.PI / 2; plaza.add(floor);
  const ringMat = (c, k = 1.6) => new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide });
  for (const [ri, ro, c, k] of [[7.4, 7.6, "#59e7ca", 1.5], [16.6, 16.75, "#8f7dff", 1.2], [24, 24.25, "#cfc6ff", 1.4], [24.9, 24.98, "#59e7ca", 1.1]]) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(ri, ro, 160), ringMat(c, k)); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02; plaza.add(ring);
  }
  // spokes from the core to each tower
  TOWERS.forEach((t) => {
    const len = 9.2, sp = new THREE.Mesh(new THREE.PlaneGeometry(0.14, len), ringMat(t.color, 1.8));
    sp.rotation.x = -Math.PI / 2; sp.rotation.z = -t.angle + Math.PI / 2;
    const mid = 7.6 + len / 2; sp.position.set(Math.cos(t.angle) * mid, 0.03, Math.sin(t.angle) * mid); plaza.add(sp);
  });
  // raised outer rail (the bright track in the reference shots) with travelling lights
  const rail = new THREE.Mesh(new THREE.TorusGeometry(24.2, 0.09, 8, 200), ringMat("#e8e2ff", 1.5)); rail.rotation.x = Math.PI / 2; rail.position.y = 0.45; plaza.add(rail);
}
const runners = new THREE.InstancedMesh(new THREE.SphereGeometry(0.22, 10, 10), new THREE.MeshBasicMaterial({ color: new THREE.Color("#ffffff").multiplyScalar(2) }), 30);
city.add(runners);

// tower light beam: additive shader cylinder, bright at the base, scanning bands moving up
function beam(color, radius, height, strength = 1) {
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { uColor: { value: new THREE.Color(color) }, uTime: { value: 0 }, uK: { value: strength } },
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }",
    fragmentShader: "uniform vec3 uColor; uniform float uTime; uniform float uK; varying vec2 vUv; void main(){ float fall = pow(1.0 - vUv.y, 1.6); float band = 0.75 + 0.25 * sin(vUv.y * 60.0 - uTime * 4.0); float edge = 0.55 + 0.45 * sin(vUv.x * 6.2832 * 3.0); float a = fall * band * edge * uK; gl_FragColor = vec4(uColor * a * 2.2, a); }",
  });
  const b = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.35, radius, height, 24, 1, true), m);
  b.geometry.translate(0, height / 2, 0); b.userData.mat = m; beams.push(m); return b;
}

// Kaelis core model (same GLB as the home page) for the plaza
new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load("models/kaelis.glb", (g) => {
  const m = g.scene, box = new THREE.Box3().setFromObject(m), size = box.getSize(new THREE.Vector3());
  const k = 3.4 / Math.max(size.x, size.y, size.z); m.scale.setScalar(k);
  m.position.sub(box.getCenter(new THREE.Vector3()).multiplyScalar(k));
  m.traverse((o) => { if (o.isMesh && o.material.emissiveIntensity > 1) o.material.emissiveIntensity = Math.min(o.material.emissiveIntensity, 4); });
  kaelisCity.add(m);
}, undefined, () => {
  const s = new THREE.Mesh(new THREE.SphereGeometry(1.6, 48, 32), new THREE.MeshStandardMaterial({ color: 0x15171f, metalness: 1, roughness: 0.3 })); kaelisCity.add(s);
});

// =================================================================== SCREENS (canvas UI drawn from live state)
const FONT = "JetBrains Mono, monospace";
function screenFrame(g, w, h, title, color) {
  g.fillStyle = "#070614"; g.fillRect(0, 0, w, h);
  g.fillStyle = color; g.fillRect(0, 0, w, 40);
  g.fillStyle = "#070614"; g.font = `700 18px ${FONT}`; g.textBaseline = "middle"; g.fillText(title.toUpperCase(), 16, 21);
  g.strokeStyle = "rgba(160,150,255,0.18)"; g.lineWidth = 1;
  for (let y = 60; y < h; y += 28) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
}
function textLines(g, lines, x, y, size = 17, gap = 27) {
  g.font = `500 ${size}px ${FONT}`; g.textBaseline = "top";
  lines.forEach((l, i) => { const [txt, col] = Array.isArray(l) ? l : [l, "#e9e5ff"]; g.fillStyle = col; g.fillText(txt, x, y + i * gap); });
}
function chart(g, x, y, w, h, color, seed, trend = 0) {
  const r = rand(seed); let v = 0.5; g.strokeStyle = color; g.lineWidth = 2.5; g.beginPath();
  for (let i = 0; i <= 80; i++) { v = clamp(v + (r() - 0.5) * 0.12 + trend * 0.004, 0.05, 0.95); const px = x + (i / 80) * w, py = y + h - v * h; i ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.stroke(); g.strokeStyle = "rgba(255,194,74,0.7)"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y + h * 0.45); g.lineTo(x + w, y + h * 0.42); g.stroke();
}

function drawClock() {
  const { cv, tex } = roomParts.clock, g = cv.getContext("2d"), c = 128, now = new Date();
  g.clearRect(0, 0, 256, 256);
  g.beginPath(); g.arc(c, c, 118, 0, Math.PI * 2); g.fillStyle = "rgba(10,8,30,0.9)"; g.fill(); g.lineWidth = 8; g.strokeStyle = "#cfc6ff"; g.stroke();
  for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2; g.fillStyle = "#cfc6ff"; g.fillRect(c + Math.sin(a) * 96 - 3, c - Math.cos(a) * 96 - 3, 6, 6); }
  const hand = (a, len, wd) => { g.beginPath(); g.moveTo(c, c); g.lineTo(c + Math.sin(a) * len, c - Math.cos(a) * len); g.lineWidth = wd; g.strokeStyle = "#fff"; g.lineCap = "round"; g.stroke(); };
  const m = now.getMinutes(), h = now.getHours() % 12;
  hand(((h + m / 60) / 12) * Math.PI * 2, 58, 9); hand((m / 60) * Math.PI * 2, 86, 6);
  tex.needsUpdate = true;
}

function labelText(id) {

function refreshLabels() { TOWERS.forEach((t) => { const [v, s] = labelText(t.id); const el = labelEls[t.id]; el.querySelector(".v").textContent = v; el.querySelector(".s").textContent = s; }); }
const proj = new THREE.Vector3();
function placeLabels() {
  const w = innerWidth, h = innerHeight, show = scene === city;
  TOWERS.forEach((t) => {
    const el = labelEls[t.id];
    proj.copy(t.top).applyMatrix4(t.group.matrixWorld).project(camera);
    const vis = show && proj.z < 1 && Math.abs(proj.x) < 1.1 && Math.abs(proj.y) < 1.1;
    el.style.opacity = vis ? 1 : 0; el.style.pointerEvents = vis ? "auto" : "none";

function openPanel(id) {
  const t = byId[id]; current = id;
  $("panel").style.setProperty("--c", t.color); $("pTitle").textContent = t.name + " tower"; $("pBody").innerHTML = panelHTML(id); $("panel").hidden = false;

  const hMint = $("hMint"); if (hMint) hMint.addEventListener("keydown", (e) => { if (e.key === "Enter") action(id); });

// the action behind the red button
async function action(id) {
  pressButton();
  if (id === "scanner") {
    const mint = ($("mint") && $("mint").value.trim()) || "";
    const res = $("res"), go = $("go");
    if (!mint) { res.innerHTML = `<p>Paste a token address first.</p>`; return; }
    state.scanning = mint; go.disabled = true; res.innerHTML = `<p>Kaelis is reading the chain…</p>`; drawScreens(id); refreshLabels();
    try {
      const out = await scanMint(mint);
      state.lastScan = { ...out, symbol: tokenSymbol(out.data, mint), at: Date.now() };
      state.watch = { log: [{ text: "Started watching $" + state.lastScan.symbol, bad: false }], timer: state.watch.timer, prev: safePulse(out.data), checks: 1 };
      startWatch();
      res.innerHTML = scanSummary(state.lastScan);
      celebrate(state.lastScan);
    } catch (e) { res.innerHTML = `<p style="color:var(--danger)">${esc(e.message || "Could not reach Solana right now. Try again in a moment.")}</p>`; }
    state.scanning = false; go.disabled = false; drawScreens(id); refreshLabels();
  } else if (id === "holders") {
    const hm = $("hMint");
    if (hm) {
      const out = $("hRes"), go = $("go"); go.disabled = true; out.innerHTML = "<p>Kaelis is counting wallets…</p>";
      try { await previewHolders(hm.value); out.innerHTML = holdersSummary(state.holdersPreview); robotCheer(); }
      catch (e) { out.innerHTML = `<p style="color:var(--danger)">${esc(e.message)}</p>`; }
      go.disabled = false; drawScreens(id); refreshLabels();
    } else { await loadHolders(); openPanel(id); drawScreens(id); refreshLabels(); }
  } else if (id === "builders") {
    await loadBuilders(); openPanel(id); drawScreens(id); refreshLabels(); robotCheer();
  } else if (id === "watch") {
    await watchTick(); openPanel(id); drawScreens(id);
  }
}
async function joinFlow() {
  const out = $("joinStep"), github = ($("ghUser").value || "").trim().replace(/^@/, "");
  const say = (html) => { out.innerHTML = html; };
  if (!state.server) return say("Proof-of-Build needs the Kaelis server (npm start or the Railway deploy).");
  if (!/^[A-Za-z0-9-]{1,39}$/.test(github)) return say("Type your GitHub username first.");
  const p = walletProvider();
  if (!p) return say("No Solana wallet found in this browser. Install Phantom or Solflare, or open this page inside your wallet app's browser.");
  try {
    if (!state.join.wallet) { const r = await p.connect(); state.join.wallet = String((r && r.publicKey) || p.publicKey); }
    const wallet = state.join.wallet, code = "kaelis-" + wallet.slice(0, 10);
    say(`Wallet ${esc(wallet.slice(0, 4))}…${esc(wallet.slice(-4))} connected.\n\n1. Add this to your GitHub bio (or a public gist description):\n   ${code}\n2. Then sign below. Signing costs nothing and moves no funds.\n\n<button class="act" id="wSign">Sign & join</button>`);
    $("wSign").addEventListener("click", async () => {
      pressButton();
      try {
        const message = `Kaelis Proof-of-Build\nGitHub: ${github}\nWallet: ${wallet}\nTime: ${new Date().toISOString()}`;
        const signed = await p.signMessage(new TextEncoder().encode(message), "utf8");
        const sig = signed && signed.signature ? signed.signature : signed;
        const signature = btoa(String.fromCharCode(...new Uint8Array(sig)));
        say("Checking your GitHub and this week's merged pull requests…");
        const r = await fetch("api/builders/register", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ github, wallet, message, signature }) });
        const j = await r.json();
        if (!r.ok) return say(esc(j.error || "Could not join.") + (j.code ? `\n\nCode: ${esc(j.code)}` : ""));
        robotCheer(); await loadBuilders(); drawScreens("builders"); refreshLabels();
        say(`You're in, ${esc(j.builder.github)}. This week: ${j.builder.weekPoints} points from ${j.builder.prs.length} merged PR(s).` + (j.builder.skipped.length ? `\n${j.builder.skipped.length} PR(s) didn't count (${esc(j.builder.skipped.map((s) => s.why).slice(0, 3).join(", "))}).` : ""));
      } catch (e) { say(esc(e.message || "Signing was cancelled.")); }
    });
  } catch (e) { say(esc(e.message || "The wallet didn't connect.")); }
}
async function watchTick() {
  const ls = state.lastScan; if (!ls) return;
  try {
    const out = await scanMint(ls.mint), now = safePulse(out.data), w = state.watch;
    w.checks++;
    const alerts = w.prev && now && K.compare ? K.compare(w.prev, now) : [];
    if (Math.abs(out.result.score - ls.result.score) >= 10) alerts.push(`Risk moved ${ls.result.score} → ${out.result.score}`);
    alerts.forEach((a) => w.log.push({ text: new Date().toTimeString().slice(0, 5) + " " + (typeof a === "string" ? a : a.text || JSON.stringify(a)), bad: true }));
    if (!alerts.length) w.log.push({ text: new Date().toTimeString().slice(0, 5) + " check " + w.checks + ": no change", bad: false });
    w.prev = now; state.lastScan = { ...ls, ...out, symbol: ls.symbol, at: Date.now() };
  } catch (e) { state.watch.log.push({ text: "check failed, will retry", bad: false }); }
  refreshLabels(); if (current === "watch") drawScreens("watch");
}
function startWatch() { clearInterval(state.watch.timer); state.watch.timer = setInterval(watchTick, 60000); }

function tween(ms, fn) {
  if (reduce || ms <= 0) { fn(1); return Promise.resolve(); }

  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);

  ray.setFromCamera(pointer, camera); const hit = ray.intersectObjects(towerHits)[0];
  hovered = hit ? hit.object.userData.tower : null; canvas.style.cursor = hovered ? "pointer" : "grab";
});
canvas.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6 || scene !== city) return;
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(pointer, camera); const hit = ray.intersectObjects(towerHits)[0];
  if (hit) enterTower(hit.object.userData.tower);
});

// =================================================================== LOOP
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  bloom.resolution.set(w * (small ? 0.5 : 0.75), h * (small ? 0.5 : 0.75));
  camera.aspect = w / h; camera.fov = w / h < 0.8 ? 58 : 40; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
camera.position.copy(CITY_VIEW.pos); controls.target.copy(CITY_VIEW.target); setCityControls(); controls.update();

const clock = new THREE.Clock(); let lastClock = 0;
function frame() {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime, m = reduce ? 0 : 1;
  beams.forEach((b) => (b.uniforms.uTime.value = t));
  if (scene === city) {
    kaelisCity.position.y = 8.2 + Math.sin(t * 1.1) * 0.35 * m;
    kaelisCity.rotation.y += ((pointer.x * 0.8 + Math.sin(t * 0.3) * 0.3 * m) - kaelisCity.rotation.y) * 0.05;
    kaelisCity.rotation.x += ((-pointer.y * 0.3) - kaelisCity.rotation.x) * 0.05;
    const mtx = new THREE.Matrix4();
    for (let i = 0; i < 30; i++) { const a = (i / 30) * Math.PI * 2 + t * 0.25 * m; mtx.makeTranslation(Math.cos(a) * 24.2, 0.62, Math.sin(a) * 24.2); runners.setMatrixAt(i, mtx); }
    runners.instanceMatrix.needsUpdate = true;
    TOWERS.forEach((tw) => { const on = hovered === tw.id; tw.crown.scale.setScalar(lerp(tw.crown.scale.x, on ? 1.35 : 1, 0.15)); tw.crown.rotation.z += dt * (on ? 2 : 0.4) * m; });
    updateCityFX(t, dt);
  } else {
    animateRobot(t, dt);
    updateRoomFX(t, dt);
    if (t - lastClock > 10) { drawClock(); lastClock = t; }
  }
  controls.update();
  composer.render();
  placeLabels();
}

// =================================================================== START
(async () => {
  await document.fonts.ready.catch(() => {});
  drawClock(); refreshLabels();
  requestAnimationFrame(frame);
  await checkHealth(); await Promise.all([loadHolders(), loadBuilders()]); refreshLabels();
  const q = new URLSearchParams(location.search).get("tower");
  if (q && byId[q]) { TOWERS.forEach((tw) => { tw.group.scale.y = 1; tw.beamMat.uniforms.uK.value = 0.6; }); fx.intro = 1; enterTower(q); }
  else intro();
})();
</script>
