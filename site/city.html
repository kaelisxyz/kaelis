<title>Kaelis Forge City</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-screen 3D city, HUD in the corners (stats top, scan bottom-left), detail panel slides in from the right (bottom sheet on phones). Single dark look by choice. */
  :root {
    --void: #08070c;
    --ink: #ece6dc;
    --dim: #9a93a3;
    --ember: #ff8a3d;
    --signal: #8fe3ff;
    --warn: #ffc24a;
    --danger: #ff4d5e;
    --panel: rgba(14, 12, 20, 0.86);
    --line: rgba(236, 230, 220, 0.14);
    --f-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
    --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; background: var(--void); color: var(--ink); overflow: hidden; }
  body { font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
  #city { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hud { position: fixed; z-index: 2; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .top { top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .brand { display: grid; gap: 2px; }
  .brand h1 { margin: 0; font-family: var(--f-display); font-size: 26px; line-height: 1; letter-spacing: 0.02em; }
  .brand h1 span { color: var(--ember); }
  .tag { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; display: grid; gap: 0; min-width: 96px; }
  .stat b { font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat.e b { color: var(--ember); } .stat.s b { color: var(--signal); } .stat.d b { color: var(--danger); }

  .scan { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: min(380px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px; display: grid; gap: 10px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .scan form { display: flex; gap: 8px; }
  .scan input { flex: 1; min-width: 0; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 3px; color: var(--ink);
    font-family: var(--f-mono); font-size: 13px; padding: 10px; }
  .scan input:focus { outline: 1px solid var(--signal); border-color: var(--signal); }
  .btn { font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
    padding: 10px 14px; border-radius: 3px; border: 1px solid var(--ember); background: var(--ember); color: var(--void); white-space: nowrap; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.sig { background: var(--signal); border-color: var(--signal); }
  .btn.bad { background: transparent; color: var(--danger); border-color: var(--danger); }
  .btn:disabled { opacity: 0.5; cursor: progress; }
  .btn:focus-visible, .x:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  .log { font-family: var(--f-mono); font-size: 12px; color: var(--dim); min-height: 1.5em; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-family: var(--f-mono); font-size: 11px; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); background: transparent; cursor: pointer; }
  .chip:hover { color: var(--ink); border-color: var(--dim); }

  .legend { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; display: grid; gap: 4px; font-size: 12px; color: var(--dim); }
  .legend i { display: inline-block; width: 9px; height: 9px; margin-right: 8px; transform: rotate(45deg); }

  .panel { position: fixed; z-index: 3; top: calc(90px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    width: min(340px, calc(100% - 32px)); max-height: calc(100% - 210px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 18px; display: grid; gap: 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .panel h2 { margin: 0; font-family: var(--f-display); font-size: 24px; line-height: 1.1; overflow-wrap: anywhere; }
  .panel p { margin: 0; color: var(--dim); }
  .x { position: absolute; top: 10px; right: 10px; background: none; border: 0; color: var(--dim); font-size: 20px; cursor: pointer; line-height: 1; padding: 4px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
  .kv span:nth-child(odd) { color: var(--dim); }
  .score { display: grid; gap: 6px; }
  .score .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .score .bar i { display: block; height: 100%; }
  .flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .flags li { display: grid; grid-template-columns: 16px 1fr; gap: 6px; font-size: 13px; }
  .flags li.on { color: var(--ink); } .flags li.off { color: var(--dim); }
  .flags li.on::before { content: "✕"; color: var(--danger); }
  .flags li.off::before { content: "✓"; color: var(--signal); }
  .quote { border-left: 2px solid var(--signal); padding-left: 10px; color: var(--ink) !important; font-style: italic; }

  .panel[hidden], .tip[hidden], .cine[hidden] { display: none; }
  .cine { position: fixed; z-index: 5; left: 50%; top: 14%; transform: translateX(-50%); pointer-events: none; font-family: var(--f-mono); }
  .cine-box { display: flex; flex-direction: column; gap: 6px; align-items: center; padding: 10px 18px; border: 1px solid rgba(143,227,255,0.5); background: rgba(8,7,12,0.55); backdrop-filter: blur(6px); }
  .cine-k { font-size: 11px; letter-spacing: 0.3em; color: var(--signal, #8fe3ff); }
  .cine-t { font-size: 15px; color: #fff; letter-spacing: 0.04em; }
  .cine-bar { display: block; width: 220px; height: 2px; background: rgba(255,255,255,0.12); }
  .cine-bar b { display: block; height: 100%; width: 0; background: #8fe3ff; transition: width 0.1s linear; }
  .cine.danger .cine-box { border-color: rgba(255,77,94,0.8); animation: cineFlash 0.25s steps(2) 4; }
  .cine.danger .cine-k, .cine.danger .cine-bar b { color: #ff4d5e; background: #ff4d5e; }
  .cine.danger .cine-k { background: none; }
  .cine.ok .cine-box { border-color: rgba(255,138,61,0.8); }
  .cine.ok .cine-k { color: #ff8a3d; }
  .cine.ok .cine-bar b { background: #ff8a3d; }
  @keyframes cineFlash { 50% { background: rgba(255,77,94,0.35); } }
  .tip { position: fixed; z-index: 4; pointer-events: none; font-family: var(--f-mono); font-size: 12px; background: var(--panel); border: 1px solid var(--line);
    padding: 4px 8px; border-radius: 3px; transform: translate(12px, 12px); white-space: nowrap; }
  .dl { position: fixed; z-index: 1; pointer-events: none; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--dim); transform: translate(-50%, -50%); white-space: nowrap; text-shadow: 0 0 8px var(--void); }
  .demo { font-family: var(--f-mono); font-size: 11px; color: var(--warn); }
  .back { font-family: var(--f-mono); font-size: 12px; color: var(--signal); text-decoration: none; margin-top: 4px; }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  @media (max-width: 720px) {
    .stats .stat { min-width: 0; padding: 6px 10px; }
    .stat b { font-size: 16px; }
    .legend { display: none; }
    .panel { top: auto; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-height: 55%; }
  }
</style>

<canvas id="city" aria-label="3D city of Kaelis builders, scanned tokens and holders"></canvas>
<div id="labels"></div>

<div class="hud top">
  <div class="brand">
    <h1>KAELIS <span>FORGE CITY</span></h1>
    <span class="tag">Drag to orbit · scroll to zoom · click a building</span>
    <span class="demo">Demo with example data</span>
    <a class="back" href="index.html">← Back to the Kaelis story</a>
  </div>
  <div class="stats">
    <div class="stat e"><span class="tag">Builders</span><b id="sBuilders">0</b></div>
    <div class="stat s"><span class="tag">Holders lit</span><b id="sHolders">0</b></div>
    <div class="stat"><span class="tag">Tokens scanned</span><b id="sScanned">0</b></div>
    <div class="stat d"><span class="tag">Rugs caught</span><b id="sRugs">0</b></div>
    <button class="btn sig" id="holdBtn" type="button">Hold $KAEL</button>
  </div>
</div>

<div class="hud scan">
  <span class="tag">Ask Kaelis to scan a token</span>
  <form id="scanForm">
    <input id="scanInput" type="text" placeholder="Token address or ticker" autocomplete="off" aria-label="Token address or ticker">
    <button class="btn" id="scanBtn" type="submit">Scan</button>
  </form>
  <div class="chips">
    <button class="chip" type="button" data-q="$NEKO">$NEKO</button>
    <button class="chip" type="button" data-q="$RUGME">$RUGME</button>
    <button class="chip" type="button" data-q="7xQk...pump">7xQk...pump</button>
  </div>
  <div class="log" id="scanLog" role="status"></div>
</div>

<div class="hud legend" aria-label="Legend">
  <span><i style="background:var(--ember)"></i>Builder tower (active)</span>
  <span><i style="background:var(--signal)"></i>Token: low risk</span>
  <span><i style="background:var(--warn)"></i>Token: suspicious</span>
  <span><i style="background:var(--danger)"></i>Token: dangerous</span>
</div>

<aside class="panel" id="panel" hidden aria-live="polite">
  <button class="x" id="closePanel" type="button" aria-label="Close">×</button>
  <div id="panelBody"></div>
</aside>
<div class="tip" id="tip" hidden></div>
<div class="cine" id="cine" hidden aria-live="polite"><div class="cine-box"><span class="cine-k" id="cineK">SCANNING</span><span class="cine-t" id="cineText"></span><i class="cine-bar"><b id="cineBar"></b></i></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/math/SimplexNoise.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/SSAOShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/SSAOPass.js"></script>
<script>
(function () {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n.toLocaleString("en-US");

  // ---------- Example data ----------
  const BUILDERS = [
    { name: "andi-dev", repo: "solana-whale-alert", commits: 15, floors: 11, kael: 500, active: true },
    { name: "rara.sol", repo: "anchor-escrow-kit", commits: 9, floors: 8, kael: 320, active: true },
    { name: "0xbima", repo: "evm-gas-profiler", commits: 22, floors: 14, kael: 740, active: true },
    { name: "mika-builds", repo: "jupiter-dca-bot", commits: 3, floors: 5, kael: 90, active: true },
    { name: "fajar.eth", repo: "safe-multisig-ui", commits: 0, floors: 7, kael: 0, active: false },
    { name: "luna_codes", repo: "nft-royalty-indexer", commits: 12, floors: 9, kael: 410, active: true },
    { name: "dimas-rs", repo: "rust-rpc-cache", commits: 18, floors: 12, kael: 610, active: true },
    { name: "tara.dev", repo: "wallet-risk-sdk", commits: 1, floors: 3, kael: 30, active: false },
    { name: "kenji-onchain", repo: "mempool-visualizer", commits: 7, floors: 6, kael: 240, active: true },
    { name: "sari-sol", repo: "token-2022-tools", commits: 0, floors: 4, kael: 0, active: false },
    { name: "rizky.build", repo: "pump-sniper-guard", commits: 11, floors: 10, kael: 380, active: true },
    { name: "naya-dev", repo: "zk-proof-playground", commits: 5, floors: 6, kael: 160, active: true }
  ];
  const FLAGS = [
    { key: "dev", text: "Developer holds more than 20% of supply", w: 25 },
    { key: "lp", text: "Liquidity is not locked or burned", w: 25 },
    { key: "mint", text: "Mint authority is still active", w: 15 },
    { key: "honey", text: "Sell simulation failed (honeypot)", w: 30 },
    { key: "hist", text: "Developer wallet launched rugged tokens before", w: 20 },
    { key: "fake", text: "Many new holders funded from one wallet", w: 15 }
  ];
  const START_TOKENS = [
    { name: "$MOONJELLY", on: [] },
    { name: "$BONKISH", on: ["mint"] },
    { name: "$ABC", on: ["dev", "lp", "hist"] },
    { name: "$SOLCAT", on: ["fake"] },
    { name: "$GIGAWIF", on: ["dev", "lp"] },
    { name: "$HONEYPOT", on: ["lp", "honey", "mint"] }
  ];

  // ---------- Scene ----------
  const canvas = $("city");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x070e1c, 1);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  const clock = new THREE.Clock();
  scene.fog = new THREE.FogExp2(0x0b1222, 0.012);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
  camera.position.set(30, 16, 34);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 6, 0);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI * 0.485;
  controls.minDistance = 14;
  controls.maxDistance = 110;
  controls.autoRotate = !reduce;
  controls.autoRotateSpeed = 0.35;

  scene.add(new THREE.HemisphereLight(0x2f5a8a, 0x1a1210, 0.28));
  const moon = new THREE.DirectionalLight(0xa8c4ff, 0.85);
  moon.position.set(-34, 30, 26); // low and lateral so every tower has a lit side and a shaded side
  moon.castShadow = true;
  moon.shadow.mapSize.set(2048, 2048);
  moon.shadow.camera.left = -40; moon.shadow.camera.right = 40;
  moon.shadow.camera.top = 40; moon.shadow.camera.bottom = -40;
  moon.shadow.camera.near = 1; moon.shadow.camera.far = 140;
  moon.shadow.bias = -0.0015; moon.shadow.normalBias = 0.2;
  moon.shadow.radius = 4;
  scene.add(moon);
  const cityGlow = new THREE.DirectionalLight(0xff9a5c, 0.18);
  cityGlow.position.set(20, 6, -30);
  scene.add(cityGlow);

  // deterministic random for textures, so the city looks the same on every load
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // sky dome + stars, also used as the reflection environment for glass facades
  function skyCanvas() {
    const c = document.createElement("canvas"); c.width = 16; c.height = 512;
    const g = c.getContext("2d");
    const grd = g.createLinearGradient(0, 0, 0, 512);
    grd.addColorStop(0, "#03081a"); grd.addColorStop(0.5, "#0a1d3c"); grd.addColorStop(0.8, "#12364a"); grd.addColorStop(0.93, "#352a3e"); grd.addColorStop(1, "#5a3a2c");
    g.fillStyle = grd; g.fillRect(0, 0, 16, 512);
    return c;
  }
  const skyTex = new THREE.CanvasTexture(skyCanvas());
  skyTex.encoding = THREE.sRGBEncoding;
  const sky = new THREE.Mesh(new THREE.SphereGeometry(170, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.52), new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false }));
  scene.add(sky);
  const STARS = 700, sPos = new Float32Array(STARS * 3), sr = mulberry32(7);
  for (let i = 0; i < STARS; i++) { const a = sr() * Math.PI * 2, e = 0.12 + sr() * 1.3, r = 160; sPos[i * 3] = Math.cos(a) * Math.cos(e) * r; sPos[i * 3 + 1] = Math.sin(e) * r; sPos[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r; }
  const starGeo = new THREE.BufferGeometry(); starGeo.setAttribute("position", new THREE.BufferAttribute(sPos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xcfd6ff, size: 0.9, sizeAttenuation: true, transparent: true, opacity: 0.8, fog: false })));
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 16, 8), new THREE.MeshBasicMaterial({ map: skyTex, color: 0x4a4a4a, side: THREE.BackSide }))); // dimmed: the sky is for looking at, not for lighting the whole city
  envScene.add(new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshBasicMaterial({ color: 0x2a2018 })).rotateX(-Math.PI / 2).translateZ(-2));
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(envScene, 0.04).texture;

  const C = { ember: 0xff8a3d, signal: 0x8fe3ff, warn: 0xffc24a, danger: 0xff4d5e };

  // ground + grid
  // 1 canvas px = 0.1 world units over an 80 x 80 city block; outside that, plain asphalt
  function groundCanvas() {
    const S = 1024, u = S / 80, cx = S / 2, cz = S / 2;
    const c = document.createElement("canvas"); c.width = c.height = S;
    const g = c.getContext("2d"), rnd = mulberry32(11);
    g.fillStyle = "#15131a"; g.fillRect(0, 0, S, S);
    for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(255,255,255,${rnd() * 0.035})`; g.fillRect(rnd() * S, rnd() * S, 2, 2); }
    const road = (x0, z0, x1, z1) => { g.fillStyle = "#1e1c24"; g.fillRect(cx + x0 * u, cz + z0 * u, (x1 - x0) * u, (z1 - z0) * u); };
    const dash = (vert, pos, from, to) => { g.fillStyle = "#6b5a2e"; for (let p = from; p < to; p += 2.2) { if (vert) g.fillRect(cx + (pos - 0.08) * u, cz + p * u, 0.16 * u, 1.1 * u); else g.fillRect(cx + p * u, cz + (pos - 0.08) * u, 1.1 * u, 0.16 * u); } };
    const curb = (x0, z0, x1, z1) => { g.fillStyle = "#3a353c"; g.fillRect(cx + x0 * u, cz + z0 * u, (x1 - x0) * u, (z1 - z0) * u); g.strokeStyle = "#4c464f"; g.lineWidth = 2; g.strokeRect(cx + x0 * u, cz + z0 * u, (x1 - x0) * u, (z1 - z0) * u); };
    // ring road around the centre, avenues to the districts
    road(-7.2, -40, -4.2, 40); road(4.2, -40, 7.2, 40); road(-40, -11.5, 40, -8.5); road(-40, 9.5, 40, 12.5); road(-40, 23, 40, 26);
    dash(true, -5.7, -40, 40); dash(true, 5.7, -40, 40); dash(false, -10, -40, 40); dash(false, 11, -40, 40); dash(false, 24.5, -40, 40);
    // crosswalk stripes at the four central corners
    g.fillStyle = "#8a8378";
    for (let k = 0; k < 6; k++) { g.fillRect(cx + (-7.2 + k * 0.5) * u, cz + -8.4 * u, 0.25 * u, 1.2 * u); g.fillRect(cx + (4.2 + k * 0.5) * u, cz + -8.4 * u, 0.25 * u, 1.2 * u); g.fillRect(cx + (-7.2 + k * 0.5) * u, cz + 8.3 * u, 0.25 * u, 1.2 * u); g.fillRect(cx + (4.2 + k * 0.5) * u, cz + 8.3 * u, 0.25 * u, 1.2 * u); }
    // sidewalks under the blocks
    curb(-24.8, -8.4, -7.4, 9.3); curb(7.4, -8.4, 24.8, 9.3); curb(-4, -8.4, 4, 9.3); curb(-17, 12.7, 17, 22.8);
    // plaza paving around the Kaelis tower
    g.strokeStyle = "rgba(143,227,255,0.18)"; g.lineWidth = 1.5;
    for (let r = 3.2; r < 8; r += 1.2) { g.beginPath(); g.arc(cx, cz + 0.5 * u, r * u, 0, Math.PI * 2); g.stroke(); }
    return c;
  }
  const groundTex = new THREE.CanvasTexture(groundCanvas());

      fireball.scale.setScalar(r); fireball.material.opacity = 0.7 * (1 - f) * (1 - f); fireball.material.color.setHSL(0.07 - f * 0.05, 1, 0.55 - f * 0.2);
      fireCore.scale.setScalar(r * 0.55); fireCore.material.opacity = 1 - f;
      fireball.position.y = top * (1 - u.collapse * 0.5) + f * 2;
      fireCore.position.copy(fireball.position);
      shock.scale.setScalar(1 + f * foot * 7); shock.material.opacity = 0.7 * (1 - f);
      boomLight.intensity = 12 * (1 - f);
      if (Math.random() < 0.7) emit(m.position.x + (Math.random() - 0.5) * u.w * 1.5, 0.5 + Math.random() * top * 0.6, m.position.z + (Math.random() - 0.5) * u.d * 1.5, 6, 0x4a4040, 2, 1.5, 2.4, 0.8);
      if (age > 1.1) { fireball.visible = fireCore.visible = shock.visible = false; boomLight.intensity = 0; }
      if (u.collapse >= 1 && !c.removed) { c.removed = true; retireBuilding(m); }
      if (age > 2.4) {
        c.phase = "return"; c.t0 = t;
        camFrom.pos.copy(camera.position); camFrom.target.copy(controls.target); camTo.pos.copy(camHome.pos); camTo.target.copy(camHome.target);
        c.camT0 = t; c.camDur = 1.6; hud("KAELIS", "back on patrol", false);
        kaelis.userData.until = 0;
      }
    } else if (c.phase === "verify") {
      const p = Math.min(1, age / 2.2);
      cineBar.style.width = Math.round(p * 100) + "%";
      const sweep = (Math.sin(age * 2.8 - Math.PI / 2) + 1) / 2;
      scanRing.position.y = 0.1 + sweep * top; scanRing.material.opacity = 0.55;
      scanSheet.position.set(m.position.x, 0.1 + sweep * top, m.position.z); scanSheet.scale.set(foot * 1.3, 1, foot * 1.3); scanSheet.lookAt(camera.position.x, scanSheet.position.y, camera.position.z); scanSheet.material.opacity = 0.35;
      beam.material.opacity = 0.3;
      if (age > 1.3 && !c.flagged) { c.flagged = true; hud("COMMIT VERIFIED", `${u.data.name} · +1 floor · +35 KAEL`, false, true); u.crown.material.emissiveIntensity = 3; emit(m.position.x, top + 0.3, m.position.z, 60, C.ember, 4, 3, 1.6, u.w); }
      if (age > 2.2) { c.phase = "zoomb"; c.t0 = t; scanRing.material.opacity = 0; scanSheet.material.opacity = 0; setCamKey(m, foot * 4 + 9, 1.4, 0.75, 1.1); } // high enough to look over the neighbouring towers
    } else if (c.phase === "zoomb") {
      if (age > 1.1) { c.phase = "build"; c.t0 = t; applyCommit(m); hud("BUILDING", `${u.data.name} · floor ${u.data.floors} going up`, false, true); cineBar.style.width = "0%"; }
    } else if (c.phase === "build") {
      cineBar.style.width = Math.round(Math.min(1, (m.scale.y - (u.targetH - FLOOR_H)) / FLOOR_H) * 100) + "%";
      if (!c.built && m.scale.y >= u.targetH - 0.02) {
        c.built = true; hud("ONLINE", `${u.data.name} · ${u.data.floors} floors · ${u.data.commits} commits`, false, true); cineBar.style.width = "100%";
        emit(m.position.x, u.targetH + 0.4, m.position.z, 140, C.ember, 6, 5, 2.2, u.w * 1.2); emit(m.position.x, u.targetH + 0.4, m.position.z, 60, 0xffe0a0, 5, 4, 2.0, u.w);
        u.crown.material.emissiveIntensity = 4; if (u.dress) u.dress.setAllLit(0.85);
      }
      if (age > 5.6) {
        c.phase = "return"; c.t0 = t;
        camFrom.pos.copy(camera.position); camFrom.target.copy(controls.target); camTo.pos.copy(camHome.pos); camTo.target.copy(camHome.target);
        c.camT0 = t; c.camDur = 1.6; hud("KAELIS", "back on patrol", false, true); kaelis.userData.until = 0;
      }
    } else if (c.phase === "return") {
      if (age > 1.6) { if (c.kind === "rug" && !c.removed) retireBuilding(m); cineEl.hidden = true; const done = c; cine = null; controls.update(); if (done.kind === "build") openPanel(m); }
    }
  }

  // ---------- Scan flow (simulated with a seeded hash) ----------
  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  const STEPS = ["Reading holders…", "Checking liquidity pool…", "Simulating a sell…", "Tracing the developer wallet…"];
  $("scanForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = $("scanInput").value.trim();
    if (!q) { $("scanLog").textContent = "Paste a token address or ticker first."; return; }
    const btn = $("scanBtn"); btn.disabled = true;
    let i = 0;
    const tick = () => {
      if (i < STEPS.length) { $("scanLog").textContent = "Kaelis: " + STEPS[i++]; setTimeout(tick, reduce ? 50 : 380); return; }
      let h = hash(q.toLowerCase());
      const on = FLAGS.filter((f, j) => ((h >>> (j * 4)) & 15) < (/rug|scam|honey/i.test(q) ? 13 : 5)).map((f) => f.key);
      const name = q.startsWith("$") ? q.toUpperCase() : q.length > 12 ? q.slice(0, 4) + "…" + q.slice(-4) : q;
      const m = placeToken({ name, on });
      $("scanLog").textContent = `Done. ${name} scored ${m.userData.data.score}/100.`;
      btn.disabled = false;
      setTimeout(() => openPanel(m), 300);
    };
    tick();
  });
  document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => { $("scanInput").value = c.dataset.q; $("scanForm").requestSubmit(); }));
  $("holdBtn").addEventListener("click", () => { lightWindows(1); focusKaelis(tower, 3); $("scanLog").textContent = "Demo: one new holder. A window in the Kaelis tower lights up."; if (selected === tower) openPanel(tower); });

  // ---------- Picking ----------
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), tip = $("tip");
  let downAt = null;
  function pick(e) {
    const r = canvas.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(pickables, false)[0];
    return hit ? hit.object : null;
  }
  function nameOf(m) { const u = m.userData; return u.kind === "builder" ? u.data.name : u.kind === "token" ? `${u.data.name} · risk ${u.data.score}` : u.kind === "tower" ? "Kaelis tower" : "Kaelis"; }
  canvas.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
  canvas.addEventListener("pointerup", (e) => {
    if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
    const m = pick(e);
    if (m) { controls.autoRotate = false; openPanel(m); }
  });
  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    const m = pick(e);
    canvas.style.cursor = m ? "pointer" : "grab";
    if (m) { tip.hidden = false; tip.textContent = nameOf(m); tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; } else tip.hidden = true;
  });

  // bloom makes lit windows, lamps and Kaelis glow like a long exposure
  const composer = new THREE.EffectComposer(renderer);
  // ambient occlusion darkens the creases between ledges, window reveals and the street. Desktop only: phones get the plain render.
  const useSSAO = window.innerWidth >= 720 && !reduce;
  let ssao = null;
  if (useSSAO) {
    ssao = new THREE.SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
    ssao.kernelRadius = 1.6; ssao.minDistance = 0.0008; ssao.maxDistance = 0.05;
    composer.addPass(ssao);
  } else composer.addPass(new THREE.RenderPass(scene, camera));
  const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(1, 1), 0.45, 0.5, 0.86);
  composer.addPass(bloom);
  // the composer renders off-screen, so tone mapping + sRGB must be applied by hand at the end
  composer.addPass(new THREE.ShaderPass({
    uniforms: { tDiffuse: { value: null }, exposure: { value: 1.05 } },
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: `uniform sampler2D tDiffuse; uniform float exposure; varying vec2 vUv;
      vec3 aces(vec3 c){ const mat3 a = mat3(0.59719,0.07600,0.02840, 0.35458,0.90834,0.13383, 0.04823,0.01566,0.83777);
        const mat3 b = mat3(1.60475,-0.10208,-0.00327, -0.53108,1.10813,-0.07276, -0.07367,-0.00605,1.07602);
        c = a * c; c = (c * (c + 0.0245786) - 0.000090537) / (c * (0.983729 * c + 0.4329510) + 0.238081); return clamp(b * c, 0.0, 1.0); }
      void main(){ vec4 t = texture2D(tDiffuse, vUv); vec3 c = aces(t.rgb * exposure / 0.6); gl_FragColor = LinearTosRGB(vec4(c, t.a)); }`
  }));
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    composer.setSize(w, h);
    if (ssao) ssao.setSize(w, h);
    bloom.resolution.set(Math.round(w / 2), Math.round(h / 2));
    camera.aspect = w / h;
    camera.fov = w < 720 ? 62 : 50;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- Loop ----------
  const v = new THREE.Vector3(), kTarget = new THREE.Vector3();
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

    // grow and flicker buildings
    if (!reduce && t - lastTwinkle > 0.3) { lastTwinkle = t; twinkle(); }
    pickables.forEach((m) => {
      const u = m.userData;
      if (!u.targetH) return;
      if (u.collapse > 0) {
        u.collapse = Math.min(1, u.collapse + dt * 0.34);
        const c = u.collapse;
        u.fm.emissive.setHex(C.danger);
        u.fm.emissiveIntensity = Math.random() * 0.5;
        if (c < 0.3) {
          // shudder: lights flicker, dust puffs out of the base
          const sh = c * 0.5; m.position.x = u.homeX + (Math.random() - 0.5) * sh; m.position.z = u.homeZ + (Math.random() - 0.5) * sh;
          if (Math.random() < 0.6) emit(m.position.x + (Math.random() - 0.5) * u.w, 0.2, m.position.z + (Math.random() - 0.5) * u.d, 4, 0x8a7a70, 1.2, 0.6, 1.4, 0.6);
          u.roof.position.y = m.scale.y;
        } else {
          if (!u.debrisDone) { u.debrisDone = true; spawnDebris(m); u.roof.visible = false; }
          const f = (c - 0.3) / 0.7;
          m.scale.y = u.targetH * Math.max(0.001, 1 - f * f);
          if (u.dress) u.dress.update(m.scale.y); // floors vanish one by one as the tower sinks
          if (u.base) { u.base.visible = m.scale.y > 1.3; u.base.position.set(m.position.x, 0, m.position.z); u.base.rotation.copy(m.rotation); }
          m.rotation.z = f * 0.35; m.rotation.x = f * 0.12;
          emit(m.position.x + (Math.random() - 0.5) * u.w * 1.6, 0.3 + Math.random() * m.scale.y * 0.3, m.position.z + (Math.random() - 0.5) * u.d * 1.6, 8, 0x9a8a80, 2.5, 1.2, 1.8, 1.0);
        }
      } else {
        if (!u.build) m.scale.y += (u.targetH - m.scale.y) * Math.min(1, dt * 2.5);
        if (u.kind === "token" && u.data.score >= 70) {
          const flick = reduce ? 1 : (Math.sin(t * 9 + u.phase) > 0.6 ? 2.4 : 0.6);
          u.crown.material.emissiveIntensity = flick;
          u.fm.emissiveIntensity = (reduce ? 0.8 : 0.5 + flick * 0.25) * 0.3;
          m.rotation.z = 0.03;
        }
        if (u.kind === "builder" && u.data.active) u.fm.emissiveIntensity += ((1.0 + Math.sin(t * 1.5 + u.phase) * 0.12) - u.fm.emissiveIntensity) * 0.05;
        u.roof.position.y = m.scale.y;
        u.roof.visible = m.visible && m.scale.y > 0.5;
        if (u.base) { u.base.visible = m.visible && m.scale.y > 1.3; if (u.base.userData.trims) u.base.userData.trims.forEach((tr) => { tr.scale.y = m.scale.y; }); }
        if (u.dress) u.dress.update(m.scale.y);
        if (u.roof.userData.beacon) u.roof.userData.beacon.visible = reduce || ((t * 1.2 + u.phase) % 1) < 0.5;
      }
      // keep windows the same real-world size however tall the tower grows
      if (u.fac) { const ry = Math.max(0.01, m.scale.y / (FLOOR_H * TILE)), rx = Math.max(0.25, u.w / (WIN_W * TILE)); u.fac.map.repeat.set(rx, ry); u.fac.lit.repeat.set(rx, ry); u.fac.nrm.repeat.set(rx, ry); }
    });

    // Kaelis patrol or focus
    const k = kaelis.userData;
    if (k.focus && t < k.until && k.focus.parent) {
      v.copy(k.focus.position); v.y = k.focus.scale.y + 4;
      kTarget.copy(v);
      if (!cine) beam.material.opacity = 0.18;
    } else {
      const a = t * (reduce ? 0 : 0.18);
      kTarget.set(Math.cos(a) * 20, 15 + Math.sin(t * 0.7) * 1.5, Math.sin(a) * 20);
      beam.material.opacity *= 0.9;
    }
    kaelis.position.lerp(kTarget, Math.min(1, dt * 1.6));
    shell.rotation.y = t * 0.3; shell.rotation.x = t * 0.17;
    halo.material.opacity = 0.75 + Math.sin(t * 2.4) * 0.15;
    const bh = Math.max(0.1, kaelis.position.y);
    beam.scale.set(1, bh, 1);
    beam.position.set(kaelis.position.x, bh / 2, kaelis.position.z);

    updateStreet(dt, t);
    updateBuilds(dt, t);
    updateDebris(dt);
    updateParticles(dt);
    updateCine(dt, t);
    if (!cine) controls.update();
    composer.render();

    // labels
    LABELS.forEach((l) => {
      v.copy(l.pos).project(camera);
      const vis = v.z < 1;
      l.el.style.display = vis ? "block" : "none";
      if (vis) { l.el.style.left = ((v.x + 1) / 2) * window.innerWidth + "px"; l.el.style.top = ((1 - v.y) / 2) * window.innerHeight + "px"; }
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
